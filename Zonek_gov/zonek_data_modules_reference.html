*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}

function getBadge(tag){
  if(tag==='api') return '<span class="badge badge-api">API</span>';
  if(tag==='rss') return '<span class="badge badge-rss">RSS</span>';
  if(tag==='scrape') return '<span class="badge badge-scrape">DevTools</span>';
  if(tag==='pdf') return '<span class="badge badge-pdf">PDF/Excel</span>';
  if(tag==='free') return '<span class="badge badge-free">free</span>';
  return '';
}

function renderModules(list){
  const container = document.getElementById('modules-list');
  container.innerHTML = '';
  list.forEach((m,i)=>{
    const div = document.createElement('div');
    div.className = 'module';
    div.dataset.tags = m.tags.join(',');
    div.innerHTML = `
      <div class="module-header" onclick="toggleModule(this)">
        <span class="mod-num">${m.num}</span>
        <span class="mod-name">${m.name}</span>
        <div class="badges">${m.tags.map(getBadge).join('')}</div>
        <span class="chevron">▼</span>
      </div>
      <div class="module-body">
        <div class="tag-row"><span class="tag">source: ${m.source}</span></div>
        <div class="section-label">Endpoints</div>
        ${m.endpoints.map(e=>`
          <div class="endpoint">
            <a class="endpoint-url" href="${e.url}" target="_blank">${e.url.length>80?e.url.slice(0,80)+'...':e.url}</a>
            <span class="endpoint-note">${e.note}</span>
          </div>
        `).join('')}
        <div class="section-label">Steps to integrate</div>
        <ol class="steps">${m.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
        <div class="section-label">IDE AI prompt</div>
        <div class="ide-box">${m.ide}</div>
      </div>
    `;
    container.appendChild(div);
  });
}

function toggleModule(header){
  const body = header.nextElementSibling;
  const chev = header.querySelector('.chevron');
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

function filterModules(type, btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = type==='all' ? modules :
    type==='api' ? modules.filter(m=>m.tags.includes('api')) :
    type==='free' ? modules.filter(m=>m.tags.includes('free')) :
    modules.filter(m=>m.tags.includes('scrape'));
  renderModules(filtered);
}

renderModules(modules);
</script>
