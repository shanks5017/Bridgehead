<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #E4E3E0;
      color: #141414;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid #14141410;
      padding-bottom: 12px;
    }
    .header h1 {
      font-size: 18px;
      margin: 0;
      font-style: italic;
      font-family: Georgia, serif;
    }
    .status {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.5;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      background: #141414;
      color: #E4E3E0;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 8px;
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #141414;
      color: #141414;
    }
    .progress-bar {
      height: 4px;
      background: #14141410;
      border-radius: 2px;
      margin-top: 16px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #141414;
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Bridgehead</h1>
  </div>
  
  <div id="status" class="status">Ready to extract</div>
  
  <button id="extractBtn" class="btn">⚡ Extract Current Page</button>
  <button id="autoScrollBtn" class="btn btn-outline">🔄 Auto-Scroll & Extract</button>
  
  <div class="progress-bar">
    <div id="progressFill" class="progress-fill"></div>
  </div>
  
  <div id="itemCount" style="font-size: 11px; margin-top: 8px; opacity: 0.5;">0 items extracted</div>

  <script src="popup.js"></script>
</body>
</html>
