name: Ingest MCA OGD

on:
  schedule:
    - cron: "0 4 1 * *"   # monthly on the 1st
  workflow_dispatch: {}    # allow manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'
          
      - run: pip install -r requirements.txt
      
      - name: Run MCA OGD Ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python -m pipeline.run --source mca_ogd
        
      - name: Alert on failure
        if: failure()
        run: echo "Ingestion failed — wire this to a real alert (email/Slack) before Phase 1 ships"
